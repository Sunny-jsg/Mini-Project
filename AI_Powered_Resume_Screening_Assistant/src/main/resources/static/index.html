<!DOCTYPE html>
<html>
<head>
    <title>AI Resume Screening</title>

    <style>

        body{
            font-family: Arial;
            margin:40px;
        }

        textarea{
            width:100%;
            height:150px;
            margin-bottom:20px;
        }

        button{
            padding:10px 20px;
            cursor:pointer;
        }

        #result{
            margin-top:30px;
            border:1px solid gray;
            padding:20px;
        }

    </style>

</head>

<body>

<h1>AI Resume Screening Assistant</h1>

<label>Candidate Name</label>
<input type="text" id="name" style="width:100%;height:30px">

<br><br>

<label>Resume</label>

<textarea id="resume"></textarea>

<label>Job Description</label>

<textarea id="jd"></textarea>

<button onclick="analyzeResume()">
    Analyze Resume
</button>

<div id="result"></div>

<script>

async function analyzeResume(){

    const request = {

        candidateName:
            document.getElementById("name").value,

        resumeText:
            document.getElementById("resume").value,

        jobDescription:
            document.getElementById("jd").value
    };

    const response = await fetch(
        "http://localhost:8080/api/resume/analyze",
        {

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify(request)
    });

    const data = await response.json();

    document.getElementById("result").innerHTML = `

        <h2>ATS Score : ${data.atsScore}</h2>

        <h3>AI Feedback</h3>

        <pre>${data.aiFeedback}</pre>
    `;
}

</script>

</body>
</html>
